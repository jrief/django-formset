name: Test django-formset

on:
  push:
    branches:
      - releases/*
    paths-ignore:
      - '**.md'
      - '**.rst'
      - '/docs/**'
      - '.deployment/*'
      - '.github/workflows/*'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '**.rst'
      - '/docs/**'
      - '.deployment/*'
      - '.github/workflows/*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["5.1.*", "5.2.*", "6.0.*"]
        node-version: ["22.x"]
        include:
          - use-monolithic: "1"
            python-version: "3.12"
            django-version: "5.2.*"
        exclude:
          - python-version: "3.10"
            django-version: "5.1.*"
          - python-version: "3.10"
            django-version: "5.2.*"
          - python-version: "3.10"
            django-version: "6.0.*"
          - python-version: "3.11"
            django-version: "6.0.*"
          - python-version: "3.13"
            django-version: "5.1.*"

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        npm install --include=dev
        python -m pip install --upgrade pip
        python -m pip install "Django==${{ matrix.django-version }}"
        python -m pip install -r testapp/requirements.txt
        playwright install
    - name: Build Parsers
      run: |
        npm run tag-attributes
        npm run no-comments
    - name: Build CSS files
      run: |
        npm run compilescss
        npm run tailwindcss
        npm run sprite-flags
    - name: Build Client
      run: |
        npm run esbuild.modular
        npm run esbuild.monolith
        npm run compilescss
    - name: Test with pytest
      run: |
        export PYTEST_USE_MONOLITHIC_BUILD=${{ matrix.use-monolithic }}
        python -m pytest testapp
