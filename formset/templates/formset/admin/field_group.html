{% spaceless %}
<div role="group"{% with css_classes=field.css_classes %} class="form-row{% if css_classes %} {{ css_classes }}{% endif %}"{% endwith %}>
	<div>
		{{ field.errors }}
		<div class="flex-container">
		{% if field.label %}{{ field.label_tag }}{% endif %}
		{{ field }}
		</div>
	{% with help_text=field.help_text %}
	{% if help_text %}{% include "./help_text.html" %}{% endif %}
	{% endwith %}
	</div>
</div>
{% endspaceless %}
